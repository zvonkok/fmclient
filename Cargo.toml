[package]
name = "fmclient"
version = "2.0.0"
edition = "2021"

[[bin]]
name = "fmclient"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
# The fabric view's schema lives with its consumer, kata-device-plugin, in
# pcilibs-rs; this client only fills it from the FM SDK.  No crates.io
# release yet; pinned to the fabric feature's head.
pcilibs-rs = { git = "https://github.com/kata-containers/pcilibs-rs", rev = "67118e9", default-features = false, features = ["fabric"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# dup/dup2 on the standard descriptors, see claim_stdout.
libc = "0.2"
